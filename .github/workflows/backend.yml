name: Backend Quality & Automation Pipeline

on:
  push:
    branches: [main, master]
    paths: ['northern-route-backend/**', 'LogisticPlatform.API/**']
  pull_request:
    branches: [main, master]
    paths: ['northern-route-backend/**', 'LogisticPlatform.API/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-guard:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Verify Dotnet Installation Runtime
        run: dotnet --info

  static-analysis:
    needs: environment-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dotnet Execution Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install Dotnet Format Tool Suite
        run: dotnet tool install -g dotnet-format --ignore-failed-sources || true
      - name: Verify Code Style and Linting Compliance
        run: dotnet format --verify-no-changes --severity info

  compile-matrix:
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dotnet Execution Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore Application Dependencies
        run: dotnet restore
      - name: Compile Backend Assembly Solutions
        run: dotnet build --configuration Release --no-restore

  unit-tests-and-sonar:
    needs: compile-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21 Runtime Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Dotnet Execution Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install SonarScanner Global Tool Suite
        run: |
          dotnet tool install -g dotnet-sonarscanner

      - name: Initiate SonarCloud Analysis Scanner Matrix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner begin \
            /k:"northern-route-backend" \
            /o:"alexandre-s-goncalves" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/**/coverage.cobertura.xml" \
            /d:sonar.exclusions="**/Migrations/**,**/mocks/**,**/*.Tests/**" \
            /d:sonar.sources="LogisticPlatform.API"

      - name: Recompile Assembly for Profile Extraction
        run: dotnet build --configuration Release

      - name: Run Test Suites with Coverage Collection
        run: dotnet test --configuration Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Conclude and Transmit SonarCloud Analysis Package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
