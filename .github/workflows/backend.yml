name: Backend Quality & Automation Pipeline

on:
  push:
    branches: [main, master]
    paths: ['northern-route-backend/**', 'LogisticPlatform.API/**']
  pull_request:
    branches: [main, master]
    paths: ['northern-route-backend/**', 'LogisticPlatform.API/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  environment-guard:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Verify Dotnet Installation Runtime
        run: dotnet --info

  static-analysis:
    needs: environment-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dotnet Execution Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Install Dotnet Format Tool Suite
        run: dotnet tool install -g dotnet-format --ignore-failed-sources || true
      - name: Verify Code Style and Linting Compliance
        run: dotnet format --verify-no-changes --severity info

  compile-matrix:
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dotnet Execution Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore Application Dependencies
        run: dotnet restore
      - name: Compile Backend Assembly Solutions
        run: dotnet build --configuration Release --no-restore

  unit-tests:
    needs: compile-matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Dotnet Execution Environment
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Run Test Suites with Coverage Collection
        run: dotnet test --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=lcov /p:CoverletOutput=../../coverage/lcov.info
      - name: Upload Telemetry Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-lcov-report
          path: coverage/lcov.info

  sonar-cloud:
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21 Runtime Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dotnet-lcov-report
          path: coverage/
      - name: SonarCloud Scan Execution
        uses: SonarSource/sonarcloud-github-action@v3
        with:
          args: >
            -Dsonar.cs.opencover.reportsPaths=coverage/lcov.info
            -Dsonar.exclusions=**/Migrations/**,**/mocks/**,**/*.Tests/**
            -Dsonar.organization=alexandre-s-goncalves
            -Dsonar.projectKey=northern-route-backend
            -Dsonar.projectName="NorthernRoute Backend"
            -Dsonar.projectVersion=1.0.0
            -Dsonar.sources=LogisticPlatform.API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
