services:
  postgres-db:
    image: postgres:17-alpine
    container_name: northern_route_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourSecurePassword2026
      POSTGRES_DB: logistic_platform_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistic_platform_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
